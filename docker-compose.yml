services:
  postgres:
    image: postgres:16-alpine
    container_name: pipagrad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pipagrad}
      POSTGRES_USER: ${POSTGRES_USER:-pipagrad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipagrad}
    ports:
      - "5432:5432"
    volumes:
      - pipagrad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipagrad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: pipagrad-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # inside the compose network, reach Postgres by service name
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

volumes:
  pipagrad-pgdata:
