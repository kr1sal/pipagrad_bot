services:
  postgres:
    image: postgres:16-alpine
    container_name: dickbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dickbot}
      POSTGRES_USER: ${POSTGRES_USER:-dickbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dickbot}
    ports:
      - "5432:5432"
    volumes:
      - dickbot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dickbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dickbot-pgdata:
